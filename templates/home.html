{% extends 'master.html' %}
{% block title %} Home {% endblock %}
{% block body %}

<div class="container">

{% for product in products %}
    <h4>{{ product.name }}</h4>
    <p>{{ product.price }}</p>
    <a href="{% url 'edit' product.id %}" class="btn btn-info"><i class="bi bi-pen-fill"></i></a>
    <a href="{% url 'delete' product.id %}" class="btn btn-danger"><i class="bi bi-archive-fill"></i></a>
    <a href="{% url 'details' product.id %}" class="btn btn-dark">details</a>




    <hr>

{% endfor %}
</div>

{% endblock %}
