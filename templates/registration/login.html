<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign In</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-sm-4">
            <h3>Sign In</h3>
            <form action="" method="post">
                {% csrf_token %}
                {{ form }}
                <button class="btn btn-outline-dark w-100">Sign In</button>
            </form>
        </div>
    </div>
</div>

</body>
</html>
